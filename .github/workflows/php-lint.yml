name: PHP Syntax Checks

on:
  push:
    branches:
      - main
      - phase-2/foundation
  pull_request:
    branches:
      - main
      - phase-2/foundation
permissions:
  contents: read

jobs:
  php-lint:
    name: PHP 8.0 Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'

      - name: Check PHP syntax
        shell: bash
        run: |
          set -e
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.php' ! -path './hospital/hms/vendor/*' -print0)
          echo "Successfully checked $count PHP files."
